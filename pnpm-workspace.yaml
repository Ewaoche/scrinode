packages:
  - "apps/*"
  - "packages/*"
# Native build scripts are blocked by default as a supply-chain guard. Each
# entry below is a deliberate decision to allow one.
allowBuilds:
  # Compiler used by the NestJS CLI to build @scrinode/api.
  '@swc/core': true
  # Downloads a MongoDB binary so tests run against a real server without
  # touching Atlas. Test-only; never a runtime dependency.
  mongodb-memory-server: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.2'
  - '@turbo/darwin-arm64@2.11.2'
  - '@turbo/linux-64@2.11.2'
  - '@turbo/linux-arm64@2.11.2'
  - '@turbo/windows-64@2.11.2'
  - '@turbo/windows-arm64@2.11.2'
  - turbo@2.11.2
