packages:
  - "apps/*"
  - "packages/*"
# Native build scripts are blocked by default as a supply-chain guard. Each
# entry below is a deliberate decision to allow one.
allowBuilds:
  # Compiler used by the NestJS CLI to build @scrinode/api.
  '@swc/core': true
  # Downloads a MongoDB binary so tests run against a real server without
  # touching Atlas. Test-only; never a runtime dependency.
  mongodb-memory-server: true
# Peer ranges we have deliberately overruled. Each must be justified, so a
# genuine incompatibility is never lost among accepted warnings.
peerDependencyRules:
  allowedVersions:
    # @auth/mongodb-adapter declares mongodb ^6; the workspace runs ^7. The
    # adapter uses only stable collection operations, verified against a real
    # MongoDB 7 server in apps/web/src/auth/adapter.test.ts. Revisit if the
    # adapter publishes a release declaring ^7.
    '@auth/mongodb-adapter>mongodb': '7'
    # next-auth 4 and @auth/core declare nodemailer ^7, but every 7.x release
    # carries unpatched advisories including SMTP command injection and CRLF
    # header injection. 9.x patches them; the SMTP transport API used by
    # EmailProvider is unchanged. Verified by apps/web/src/auth/nodemailer.test.ts.
    'next-auth>nodemailer': '9'
    '@auth/core>nodemailer': '9'

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.2'
  - '@turbo/darwin-arm64@2.11.2'
  - '@turbo/linux-64@2.11.2'
  - '@turbo/linux-arm64@2.11.2'
  - '@turbo/windows-64@2.11.2'
  - '@turbo/windows-arm64@2.11.2'
  - turbo@2.11.2
