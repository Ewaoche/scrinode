# Scrinode droplet deployment.
#
# The API and Postgres run here; the reader and backoffice stay on Vercel and
# call the API over HTTPS (AGENTS.md §30).
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Deliberately a separate file from docker-compose.yml rather than an
# override. Local development publishes a database port and accepts a default
# password; production must do neither, and an override that is easy to forget
# to pass is not a safe way to express that difference.
#
# Settings come from an .env file beside this one, on the droplet, never from
# the repository. Every value below without a default fails the stack if
# unset — see infra/README.md.

services:
  postgres:
    build:
      context: ./infra/postgres
      args:
        PG_MAJOR: '17'
    image: scrinode/postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      # No default. A production database must never accept a password that
      # is written down in a repository.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'

    # No `ports`. This is the whole reason the API moved to the droplet:
    # Postgres is reachable only over the compose network, so there is no
    # public surface to firewall, no TLS to terminate and no credential
    # crossing the internet.
    expose:
      - '5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      # Where pg_dump writes. A named volume rather than a bind mount so the
      # backup survives the repository directory being replaced on deploy.
      - postgres_backups:/backups

    healthcheck:
      test: ['CMD-SHELL', 'psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -c "SELECT 1" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    shm_size: 256mb

    command:
      - postgres
      # Sized for the droplet, not a laptop. See infra/postgres/README.md for
      # how these scale with RAM; maintenance_work_mem in particular decides
      # whether an HNSW index build takes minutes or hours.
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-512MB}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - max_parallel_maintenance_workers=2
      # Logs a query slower than a second. §34 wants query latency tracked,
      # and until Sentry is wired this is the cheapest signal available.
      - -c
      - log_min_duration_statement=1000

    logging: &logging
      # Without a cap, container logs fill the droplet's disk and Postgres
      # stops accepting writes — the classic self-hosted outage.
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    image: scrinode/api:latest
    restart: unless-stopped

    depends_on:
      postgres:
        # Waits for the database to answer a query, not merely to start, so
        # the API's first connection attempt is not a race.
        condition: service_healthy

    environment:
      NODE_ENV: production
      API_PORT: 4000
      # `postgres` is the service name on the compose network. TLS is off
      # because the connection never leaves that network; the value is still
      # explicit so moving to a managed database stays a config change.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL: 'false'
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      # The Vercel origins allowed to call this API. No wildcard: the API
      # serves credentialed requests and the schema rejects '*' (§33).
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}

    ports:
      # Published to localhost only. A reverse proxy on the droplet
      # terminates TLS and forwards here; exposing 4000 publicly would serve
      # the API over plain HTTP.
      - '127.0.0.1:${API_PORT:-4000}:4000'

    logging: *logging

volumes:
  postgres_data:
  postgres_backups:
