# Scrinode container deployment — SUPERSEDED, kept deliberately.
#
# The API now runs on Vercel as a serverless function (AGENTS.md §30,
# docs/PLAN_vercel_api.md). Nothing deploys this file.
#
# It is kept, and `apps/api/src/main.ts` is kept working, because §30 requires
# NestJS stay cloud-portable: this is the proof that the API still runs as an
# ordinary long-lived container, and the fallback if Vercel's function limits
# ever stop fitting (§29's heavy work, or §18's streaming at length).
#
# If you run it: the database is still Neon, so DATABASE_URL and CORS_ORIGINS
# must be supplied and TLS is mandatory. It brings up the API only.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Deliberately a separate file from docker-compose.yml rather than an
# override. Local development runs Postgres in a container with a default
# password; production uses Neon and must never carry a credential default,
# and an override that is easy to forget to pass is not a safe way to express
# that difference.
#
# Settings come from an .env file beside this one, on the droplet, never from
# the repository. Every value below without a default fails the stack if
# unset — see infra/README.md.

services:
  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    image: scrinode/api:latest
    restart: unless-stopped

    environment:
      NODE_ENV: production
      API_PORT: 4000

      # The Neon connection string, in full, from .env. Unlike the previous
      # compose-network topology this cannot be composed from parts: it
      # carries a generated host, a role and query parameters that belong
      # together. No default — a production database must never be reachable
      # with a credential written down in this repository.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

      # Mandatory, not a preference. The connection crosses the public
      # internet to Neon, so without TLS the credential travels in cleartext.
      # The driver verifies the certificate chain (rejectUnauthorized), so
      # this also authenticates the server rather than merely encrypting.
      DATABASE_SSL: 'true'

      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}

      # The Vercel origins allowed to call this API. No wildcard: the API
      # serves credentialed requests and the schema rejects '*' (§33).
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}

    ports:
      # Published to localhost only. A reverse proxy on the droplet
      # terminates TLS and forwards here; exposing 4000 publicly would serve
      # the API over plain HTTP.
      - '127.0.0.1:${API_PORT:-4000}:4000'

    logging:
      # Without a cap, container logs fill the droplet's disk. Less acute now
      # that Postgres is not colocated, but an API that cannot write logs is
      # still an API whose failures are invisible.
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
